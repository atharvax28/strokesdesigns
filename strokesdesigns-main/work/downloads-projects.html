    <div class="instructions">
        <div class="desktop-instructions">
            <strong>Click & Drag</strong> to drag items<br>
            <strong>Double Click</strong> to open items
        </div>
        <div class="mobile-instructions">
            <strong>Tap & Drag</strong> to drag items<br>
            <strong>Tap</strong> to open items
        </div>
    </div>

    <script>
        let draggedElement = null;
        let offsetX = 0;
        let offsetY = 0;
        let clickTimeout = null;
        let clickCount = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let isTouchDevice = false;

        const items = document.querySelectorAll('.folder');

        items.forEach(item => {
            item.addEventListener('mousedown', startDrag);
            item.addEventListener('touchstart', function (e) {
                isTouchDevice = true;
                startDrag.call(this, e);
            });
        });

        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('touchend', endDrag);

        function startDrag(e) {
            draggedElement = this;
            isDragging = false;

            const touch = e.touches ? e.touches[0] : e;
            const rect = draggedElement.getBoundingClientRect();

            startX = touch.clientX;
            startY = touch.clientY;
            offsetX = touch.clientX - rect.left;
            offsetY = touch.clientY - rect.top;
        }

        function drag(e) {
            if (!draggedElement) return;

            const touch = e.touches ? e.touches[0] : e;
            const deltaX = Math.abs(touch.clientX - startX);
            const deltaY = Math.abs(touch.clientY - startY);

            if (deltaX > 5 || deltaY > 5) {
                isDragging = true;
                e.preventDefault();

                if (!draggedElement.classList.contains('dragging')) {
                    draggedElement.classList.add('dragging');
                }

                let newX = touch.clientX - offsetX;
                let newY = touch.clientY - offsetY;

                newX = Math.max(0, Math.min(newX, window.innerWidth - 113));
                newY = Math.max(0, Math.min(newY, window.innerHeight - 110));

                draggedElement.style.left = newX + 'px';
                draggedElement.style.top = newY + 'px';
            }
        }

        function endDrag(e) {
            if (draggedElement) {
                const wasDragging = isDragging;
                const element = draggedElement;

                draggedElement.classList.remove('dragging');
                draggedElement = null;
                isDragging = false;

                // On touch devices, open the folder on tap (not drag)
                if (isTouchDevice && !wasDragging && e.type === 'touchend') {
                    e.preventDefault();
                    openItem(element);
                }
            }
        }

        // Desktop: double-click to open (mouse only)
        items.forEach(item => {
            item.addEventListener('click', function (e) {
                if (isTouchDevice) return;
                if (isDragging) {
                    isDragging = false;
                    return;
                }

                clickCount++;

                if (clickCount === 1) {
                    clickTimeout = setTimeout(() => {
                        clickCount = 0;
                    }, 400);
                } else if (clickCount === 2) {
                    clearTimeout(clickTimeout);
                    clickCount = 0;
                    openItem(this);
                }
            });
        });

        function openItem(item) {
            const url = item.getAttribute('data-url');
            if (url) {
                window.open(url, '_blank');
            }
        }
    </script>
