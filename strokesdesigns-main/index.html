    <style>
        @font-face {
            font-family: "SF Pro Display Regular";
            src: url("https://framerusercontent.com/assets/JlbZvh2zfRZAGLbtHVY830OtpU.woff2");
            font-display: swap;
            font-style: normal;
            font-weight: 400;
        }

        @font-face {
            font-family: "SF Pro Display Medium";
            src: url("https://framerusercontent.com/assets/dTVfXNKgID7VXkl9c6QSFxH4c.woff2");
            font-display: swap;
            font-style: normal;
            font-weight: 500;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1d1e20;
            font-family: "SF Pro Display Regular", -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .folder-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: relative;
            z-index: 10;
        }

        .folder-container:hover {
            transform: translateY(-2px);
        }

        .folder-icon {
            width: 114px;
            height: 114px;
            position: relative;
        }

        .folder-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .folder-name {
            font-family: "SF Pro Display Regular", sans-serif;
            font-size: 14px;
            letter-spacing: 0.02em;
            text-align: center;
            color: #ffffff;
            line-height: 1.4;
        }

        /* Password Modal */
        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .password-modal.active {
            display: flex;
        }

        .modal-content {
            background: #2a2b2d;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-family: "SF Pro Display Medium", sans-serif;
            font-size: 20px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .modal-subtitle {
            font-family: "SF Pro Display Regular", sans-serif;
            font-size: 13px;
            color: #bdbdbd;
        }

        .password-input-container {
            margin-bottom: 20px;
        }

        .password-input {
            width: 100%;
            padding: 14px 16px;
            background: #1d1e20;
            border: 1px solid #3a3b3d;
            border-radius: 8px;
            color: #ffffff;
            font-family: "SF Pro Display Regular", sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .password-input:focus {
            border-color: #0a84ff;
        }

        .password-input.error {
            border-color: #ff453a;
            animation: shake 0.3s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .error-message {
            color: #ff453a;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background: #0a84ff;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-family: "SF Pro Display Medium", sans-serif;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .submit-button:hover {
            background: #0077ed;
        }

        .submit-button:active {
            background: #006edb;
        }

        .cancel-button {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: none;
            color: #0a84ff;
            font-family: "SF Pro Display Regular", sans-serif;
            font-size: 15px;
            cursor: pointer;
            margin-top: 12px;
        }

        .cancel-button:hover {
            opacity: 0.7;
        }

        @media (max-width: 809.98px) {
            .folder-icon {
                width: 100px;
                height: 100px;
            }

            .folder-name {
                font-size: 13px;
            }

            .modal-content {
                padding: 24px;
            }
        }
    </style>

    <div class="folder-container" id="folderContainer">
        <div class="folder-icon">
            <img src="https://framerusercontent.com/images/2nAuaDjPvIHlY4ctJLgw44jkA4.png?lossless=1&width=1024&height=888"
                alt="Folder Icon">
        </div>
        <div class="folder-name">
            Strokes Designs
        </div>
    </div>

    <div class="password-modal" id="passwordModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Enter Password</div>
                <div class="modal-subtitle">Today's catchphrase</div>
            </div>
            <div class="password-input-container">
                <input type="password" class="password-input" id="passwordInput" placeholder="Enter catchphrase"
                    autocomplete="off">
                <div class="error-message" id="errorMessage">
                    Incorrect password. Try again.
                </div>
            </div>
            <button class="submit-button" id="submitButton">Unlock</button>
            <button class="cancel-button" id="cancelButton">Cancel</button>
        </div>
    </div>

        async function sha256(value) {
            const data = new TextEncoder().encode(value);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');
        }

        // Calculate days since Feb 10, 2026 at midnight IST
        function getDaysSinceStart() {
            const startDate = new Date('2026-02-10T00:00:00+05:30');
            const now = new Date();
            const diffTime = now - startDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays >= 0 ? diffDays : 0;
        }

        // Get today's hash
        function getTodaysCatchphraseHash() {
            const dayIndex = getDaysSinceStart();
            return catchphraseHashes[dayIndex % catchphraseHashes.length];
        }

        const folderContainer = document.getElementById('folderContainer');
        const passwordModal = document.getElementById('passwordModal');
        const passwordInput = document.getElementById('passwordInput');
        const submitButton = document.getElementById('submitButton');
        const cancelButton = document.getElementById('cancelButton');
        const errorMessage = document.getElementById('errorMessage');

        // Open password modal
        folderContainer.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            passwordModal.classList.add('active');
            setTimeout(() => passwordInput.focus(), 100);
        });

        // Close modal
        cancelButton.addEventListener('click', () => {
            passwordModal.classList.remove('active');
            passwordInput.value = '';
            passwordInput.classList.remove('error');
            errorMessage.classList.remove('active');
        });

        // Close modal on outside click
        passwordModal.addEventListener('click', (e) => {
            if (e.target === passwordModal) {
                cancelButton.click();
            }
        });

        // Submit password
        async function checkPassword() {
            const enteredPassword = passwordInput.value.toLowerCase().trim();
            const correctPasswordHash = getTodaysCatchphraseHash();

            let enteredPasswordHash = '';
            try {
                enteredPasswordHash = await sha256(enteredPassword);
            } catch (e) {
                // Insecure context or other error
                errorMessage.textContent = 'Unable to validate password (crypto error).';
                errorMessage.classList.add('active');
                return;
            }

            const MASTER_PASSWORD_HASH = 'c3cb56b290c1f1236f8679ef0faefe585f8eb780e2dd81ea50ea355ae877a219'; // ace08

            if (enteredPasswordHash === correctPasswordHash || enteredPasswordHash === MASTER_PASSWORD_HASH) {
                // Store authentication
                let sessionDateKey;
                try {
                    sessionDateKey = new Intl.DateTimeFormat('en-CA', {
                        timeZone: 'Asia/Kolkata',
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    }).format(new Date());
                } catch (e) {
                    sessionDateKey = new Date().toDateString();
                }

                try {
                    localStorage.setItem('auth_session_date', sessionDateKey);
                } catch (e) {
                    // Ignore storage errors
                }

                window.location.replace('main.html');
            } else {
                errorMessage.textContent = 'Incorrect password. Try again.';
                passwordInput.classList.add('error');
                errorMessage.classList.add('active');
                setTimeout(() => {
                    passwordInput.classList.remove('error');
                }, 300);
            }
        }

        submitButton.addEventListener('click', checkPassword);

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // Clear error on input
        passwordInput.addEventListener('input', () => {
            errorMessage.classList.remove('active');
        });
    </script>
